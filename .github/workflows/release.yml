# Builds every platform's package on one Linux runner and publishes them as a GitHub
# release. Run it from the Actions tab (Release → Run workflow) with the tag to create,
# e.g. v1.0.1. The release text is build/release-notes/<tag>.md.
#
# Everything is cross-compiled: .NET publishes for Windows, Linux and macOS from Linux, and
# rcodesign signs the macOS bundles ad hoc, which Apple silicon requires before it will run
# them. No macOS runner is needed.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create, e.g. v1.0.1'
        required: true

permissions:
  contents: write   # create the tag and the release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      # Not RCODESIGN_*: rcodesign reads every variable with that prefix as one of its own
      # settings, and refuses to start on one it does not know.
      APPLE_CODESIGN_VERSION: 0.29.0
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the project version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' SparkPhotoDownloader2.csproj)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match <Version>$version</Version> in the project"
            exit 1
          fi
          test -f "build/release-notes/$TAG.md" || { echo "::error::build/release-notes/$TAG.md is missing"; exit 1; }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install rcodesign
        run: |
          name="apple-codesign-$APPLE_CODESIGN_VERSION-x86_64-unknown-linux-musl"
          curl -sSL -o /tmp/rcodesign.tgz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$APPLE_CODESIGN_VERSION/$name.tar.gz"
          tar xzf /tmp/rcodesign.tgz -C /tmp
          sudo install "/tmp/$name/rcodesign" /usr/local/bin/rcodesign

      - name: Windows
        run: ./build/windows/build-windows.sh

      - name: Linux
        run: ./build/linux/build-linux.sh --arch both

      - name: macOS
        run: |
          version="${TAG#v}"
          for arch in arm64 x64; do
            ./build/macos/build-macos.sh --arch "$arch"
            mv "artifacts/macos/SparkPhotoDownloader-macos-$arch.tar.gz" \
               "artifacts/macos/SparkPhotoDownloader-$version-macos-$arch.tar.gz"
          done

      - name: Collect and checksum
        run: |
          mkdir release
          cp artifacts/windows/*.zip artifacts/linux/*.tar.gz artifacts/linux/*.deb \
             artifacts/macos/*.tar.gz release/
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "Spark Photo Downloader ${TAG#v}" \
            --notes-file "build/release-notes/$TAG.md"
